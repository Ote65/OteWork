<h2>装完怎么用</h2>
<p>打开「应用程序」里的 DeepSeek Harness。插件在第一次打开时自动写进配置，界面即刻是欧创的样子。若打开后外观还是原版，完全退出再打开一次即可。</p>
<p>插件文件在 <code>/usr/local/share/OteWork</code>。</p>
<h2>卸载</h2>
<p>终端运行 <code>node /usr/local/share/OteWork/install.mjs --root /usr/local/share/OteWork --uninstall</code> 会移除插件与写进应用的配置，再把「应用程序」里的 DeepSeek Harness 拖进废纸篓即可。</p>

<!DOCTYPE html>

<style>
  body { font: 13px -apple-system, "PingFang SC", sans-serif; color: #1c221f; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  p { margin: 0 0 8px; line-height: 1.6; }
  code { font: 12px Menlo, monospace; background: #f0f2f1; padding: 1px 4px; border-radius: 3px; }

<body>
<h2>把 OteWork 装进你的 DeepSeek Harness</h2>
<p>这个安装器会把 <b>OteWork 插件集</b>装到 <code>/usr/local/share/OteWork</code>，并以当前登录用户的身份把插件写进 DSH 的 profile 配置。</p>
<p>安装程序自动完成三件事：复制插件到 DSH 的资料目录、把插件写进每个 profile 的启用列表、刷新模块链接。</p>
<p><span class="accent">装完请完全退出并重新启动 DeepSeek Harness</span>（不是刷新页面），插件才会被加载。</p>
</body>
</html>

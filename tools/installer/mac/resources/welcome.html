<h2>安装 OteWork</h2>
<p>OteWork 是 <b>DeepSeek Harness 的成品版</b>：本次安装会把整个应用（<b>DeepSeek Harness <!--APPVERSION--></b>）装进「应用程序」，并同时装上 OteWork 的界面与能力插件。</p>
<p>安装需要一个管理员密码。应用是官方原版，签名与公证都保持不变，装完第一次打开不会被系统拦截。</p>
<p>插件会在首次打开应用时自动就位——<span class="accent">装完直接打开 OteWork，界面就是欧创的</span>，不需要进终端敲命令。</p>
